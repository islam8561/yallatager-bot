name: متابعة أسعار يلا تاجر

on:
  schedule:
    - cron: "*/30 * * * *"   # كل 30 دقيقة
  workflow_dispatch:          # زرار تشغيل يدوي

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # آخر نسخة، مش النسخة اللي كانت وقت ما الرسالة وصلت (ده كان سبب الرد المكرر)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl cryptography
      - name: شيك على الأسعار
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          BOT_SECRET: ${{ secrets.BOT_SECRET }}
        run: python monitor.py
      - name: احفظ الأسعار والإعدادات
        if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "تحديث الأسعار"
          git pull --rebase -X theirs -q || true
          git push
