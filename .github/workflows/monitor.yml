name: متابعة أسعار يلا تاجر

on:
  schedule:
    - cron: "*/30 * * * *"   # كل 30 دقيقة
  workflow_dispatch:          # زرار تشغيل يدوي

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: شيك على الأسعار
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python monitor.py
      - name: احفظ الأسعار
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "تحديث الأسعار"
          git push
